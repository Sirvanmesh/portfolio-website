AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time setup for the portfolio website: lets GitHub Actions deploy to this AWS account
  without stored keys (OIDC), creates the Terraform state bucket, and adds a monthly budget alert.

Parameters:
  GitHubOwner:
    Type: String
    Description: Your GitHub username (the owner of the repository).
  GitHubRepo:
    Type: String
    Default: portfolio-website
    Description: The repository name.
  BudgetEmail:
    Type: String
    Description: Where AWS sends the budget alert email.
  MonthlyBudgetUSD:
    Type: Number
    Default: 1
    Description: Alert when monthly AWS spend reaches this amount (USD).
  ExistingOIDCProviderArn:
    Type: String
    Default: ""
    Description: >-
      Leave empty. Only fill this if your account already has the GitHub OIDC provider
      (token.actions.githubusercontent.com); paste its ARN here.
  GitHubSubjectPrefix:
    Type: String
    Default: ""
    Description: >-
      Leave empty unless your repository uses GitHub's immutable OIDC subject. Then paste the
      sub_claim_prefix from `gh api repos/OWNER/REPO/actions/oidc/customization/sub`,
      for example repo:Owner@123/portfolio-website@456.

Conditions:
  CreateOIDCProvider: !Equals [!Ref ExistingOIDCProviderArn, ""]
  UseLegacySubject: !Equals [!Ref GitHubSubjectPrefix, ""]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: project
          Value: portfolio-website

  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub portfolio-website-tfstate-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-state-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: project
          Value: portfolio-website

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portfolio-website-github-deploy
      Description: Assumed by GitHub Actions (OIDC) to deploy the portfolio website.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Ref ExistingOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !If
                  - UseLegacySubject
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:*
                  - !Sub ${GitHubSubjectPrefix}:*
      Policies:
        - PolicyName: portfolio-website-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ProjectBucketsOnly
                Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::portfolio-website-*
                  - arn:aws:s3:::portfolio-website-*/*
              - Sid: CloudFront
                Effect: Allow
                Action: cloudfront:*
                Resource: "*"
              - Sid: WhoAmI
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"
      Tags:
        - Key: project
          Value: portfolio-website

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: portfolio-website-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub repository variable AWS_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  StateBucketName:
    Description: Put this in the GitHub repository variable TF_STATE_BUCKET
    Value: !Ref StateBucket
  Region:
    Description: Put this in the GitHub repository variable AWS_REGION
    Value: !Ref AWS::Region
