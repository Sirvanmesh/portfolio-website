name: Destroy environment

# Manual only: Actions tab → "Destroy environment" → Run workflow.
# Deletes the site's S3 bucket and CloudFront distribution for one environment.
# The bootstrap stack (deploy role, state bucket, budget) is NOT touched.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to delete
        required: true
        type: choice
        options: [dev, prod]
      confirm:
        description: Type DESTROY to confirm
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
      TF_DIR: infra/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform destroy
        run: |
          # Terraform reads the chat bundle path even when deleting; an empty stand-in is enough.
          mkdir -p chat-api/dist && echo "export const handler = () => {};" > chat-api/dist/index.mjs
          terraform -chdir=$TF_DIR init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=portfolio-website/${{ inputs.environment }}.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir=$TF_DIR destroy -auto-approve -input=false -var="aws_region=$AWS_REGION"
