name: Deploy one environment

# Called by pipeline.yml. Creates/updates the AWS resources with Terraform,
# uploads the built site to S3 and clears the CloudFront cache.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.tf.outputs.site_url }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
      TF_DIR: infra/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Sign in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform apply
        id: tf
        run: |
          terraform -chdir=$TF_DIR init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=portfolio-website/${{ inputs.environment }}.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir=$TF_DIR apply -auto-approve -input=false -var="aws_region=$AWS_REGION"
          echo "bucket=$(terraform -chdir=$TF_DIR output -raw bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform -chdir=$TF_DIR output -raw distribution_id)" >> "$GITHUB_OUTPUT"
          echo "site_url=$(terraform -chdir=$TF_DIR output -raw site_url)" >> "$GITHUB_OUTPUT"

      - name: Upload site to S3
        run: |
          # Hashed build files never change: cache them for a year.
          aws s3 sync out/_next/static "s3://${{ steps.tf.outputs.bucket }}/_next/static" \
            --cache-control "public,max-age=31536000,immutable"
          # Everything else: always check for a fresh copy.
          aws s3 sync out/ "s3://${{ steps.tf.outputs.bucket }}/" --delete \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Clear CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution }}" \
            --paths "/*" > /dev/null

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.tf.outputs.site_url }}/") || true
            [ "$code" = "200" ] && echo "Site is up ($code)" && exit 0
            echo "Got $code, retrying in 20s..."; sleep 20
          done
          echo "Site did not return 200"; exit 1

      - name: Summary
        run: echo "### ${{ inputs.environment }} is live → ${{ steps.tf.outputs.site_url }}" >> "$GITHUB_STEP_SUMMARY"
